# =============================================================
# BALANCER.CONF - Nginx Load Balancer
# Los 3 algoritmos estan definidos abajo, pero solo UNO se usa
# a la vez. Se elige cambiando la linea "proxy_pass" en location /
# =============================================================

# ---------- ALGORITMO 1: ROUND ROBIN (por defecto) ----------
# Distribuye las peticiones equitativamente, una a cada backend en orden.
# - max_fails=1: marca el backend como caido tras 1 fallo
# - fail_timeout=5s: si falla, no vuelve a enviarle peticiones por 5 segundos
upstream backend_servers_1 {
    server 127.0.0.1:5001 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:5002 max_fails=1 fail_timeout=5s;
}

# ---------- ALGORITMO 2: LEAST CONNECTIONS ----------
# Envia la peticion al backend que tenga MENOS conexiones activas.
# Util cuando cada backend procesa peticiones de distinta duracion.
upstream backend_servers_2 {
    least_conn;
    server 127.0.0.1:5001;
    server 127.0.0.1:5002;
}

# ---------- ALGORITMO 3: IP HASH ----------
# El MISMO cliente (misma IP) siempre va al MISMO backend.
# Util para mantener sesiones (sticky sessions), no ideal para
# balance de carga real si hay pocas IPs (ej. detras de un proxy).
upstream backend_servers_3 {
    ip_hash;
    server 127.0.0.1:5001;
    server 127.0.0.1:5002;
}


# ---------- SERVIDOR PRINCIPAL: escucha y redirige ----------
server {
    # Puerto donde entra el trafico (HTTP)
    # Se usa 8000 para evitar conflicto con el site "default" que usa el 80
    listen 8000;
    server_name localhost;

    # Todas las peticiones entrantes pasan por aqui
    location / {

        # ====== AQUI SE ELIGE EL ALGORITMO ======
        # Cambiar entre: backend_servers_1 (Round Robin)
        #                backend_servers_2 (Least Connections)
        #                backend_servers_3 (IP Hash)
        proxy_pass http://backend_servers_1;

        # Parametros de FAILOVER / RESILIENCIA (chaos test)
        # Si un backend responde error, intenta con el siguiente upstream
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;        # maximo 2 reintentos
        proxy_next_upstream_timeout 2s;     # tiempo total para reintentar

        # Timeouts CORTOS para detectar caidas en sub-segundos
        proxy_connect_timeout 1s;   # tiempo maximo para conectar al backend
        proxy_read_timeout 2s;      # tiempo maximo para leer la respuesta
        proxy_send_timeout 2s;      # tiempo maximo para enviar la peticion

        # Encabezados estandar que se reenvian al backend
        # Necesarios para que el backend conozca la IP real del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
