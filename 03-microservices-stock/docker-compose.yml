name: 03-microservices-stock

services:
  postgres:
    image: postgres:16-alpine
    container_name: taller3-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5435}:${POSTGRES_PORT:-5435}"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [taller3]
  
  registro:
    build: ./micro-services/registro
    container_name: taller3-registro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=${REGISTRO_PORT:-6003}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${REGISTRO_PORT:-6003}:${REGISTRO_PORT:-6003}"
    networks: [taller3]

  login:
    build: ./micro-services/login
    container_name: taller3-login
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=${LOGIN_PORT:-6004}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${LOGIN_PORT:-6004}:${LOGIN_PORT:-6004}"
    networks: [taller3]

  redis:
    image: redis:7-alpine
    container_name: taller3-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [taller3]

  stock-a:
    build: ./micro-services/stock
    container_name: taller3-stock-a
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=${STOCK_PORT_A:-6001}
      - REDIS_URL=redis://redis:6379/0
      - MODO_ESTADO=${MODO_ESTADO:-redis}
      - STOCK_INICIAL=${STOCK_INICIAL:-5}
      - STOCK_PRODUCTOS=${STOCK_PRODUCTOS:-1,2,3}
      - STOCK_AUTOSEED=${STOCK_AUTOSEED:-1}
    ports:
      - "${STOCK_PORT_A:-6001}:${STOCK_PORT_A:-6001}"
    networks: [taller3]

  stock-b:
    build: ./micro-services/stock
    container_name: taller3-stock-b
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=${STOCK_PORT_B:-6002}
      - REDIS_URL=redis://redis:6379/0
      - MODO_ESTADO=${MODO_ESTADO:-redis}
      - STOCK_INICIAL=${STOCK_INICIAL:-5}
      - STOCK_PRODUCTOS=${STOCK_PRODUCTOS:-1,2,3}
      - STOCK_AUTOSEED=${STOCK_AUTOSEED:-1}
    ports:
      - "${STOCK_PORT_B:-6002}:${STOCK_PORT_B:-6002}"
    networks: [taller3]

networks:
    taller3:
      driver: bridge