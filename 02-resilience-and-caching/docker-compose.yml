name: 02-resilience-and-caching

services:
  # Servicio de redis para almacenamiento en caché
  redis:
    image: redis:7-alpine
    container_name: taller2-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - taller2

  # Servicios de backend en Node.js
  backend-node-1:
    build: ./backend/node-server
    container_name: backend-nodo-5001
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=5001
      - REDIS_URL=redis://redis:6379
      - DB_PATH=/app/data/db.sqlite
    volumes:
      - ./data:/app/data
    networks: [taller2]

  backend-node-2:
    build: ./backend/node-server
    container_name: backend-nodo-5002
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=5002
      - REDIS_URL=redis://redis:6379
      - DB_PATH=/app/data/db.sqlite
    volumes:
      - ./data:/app/data
    networks: [taller2]
  
  backend-python:
    build: ./backend/python-server
    container_name: backend-nodo-5003
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=5003
      - REDIS_URL=redis://redis:6379
      - DB_PATH=/app/data/db.sqlite
    volumes:
      - ./data:/app/data
    networks: [taller2]

  # Balanceador de carga Nginx
  nginx-lb:
    image: nginx:1.27-alpine
    container_name: taller2-nginx
    depends_on:
      - backend-node-1
      - backend-node-2
      - backend-python
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [taller2]

networks:
  taller2:
    driver: bridge